[project]
name = "pytorchmlx"
version = "0.0.1"
description = "An educational PyTorch-shaped interface for MLX and PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Priyanshu Jain" },
]
dependencies = [
    "mlx>=0.32.2,<0.33",
    "numpy",
    "torch>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchmlx"]

[tool.pyright]
typeCheckingMode = "standard"
include = ["src", "examples/tinystories-llm/train.py"]
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
]
