[project]
name = "torchmlx"
version = "0.1.0"
description = "An educational PyTorch-shaped interface for MLX and PyTorch"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
    { name = "Priyanshu Jain" },
]
dependencies = [
    "mlx>=0.32.2,<0.33",
    "numpy",
    "torch>=2.4,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/torchmlx"]
